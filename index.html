<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f3ead8" />
  <meta name="description" content="随机选择今天吃的蔬菜和肉类，查看营养关键词与家常做法。" />
  <title>今天吃什么？</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./script.js" defer></script>
</head>
<body>
  <div class="background-photos" aria-hidden="true">
    <img src="./watermark-1.png" alt="" />
    <img src="./watermark-2.png" alt="" />
    <img src="./watermark-3.png" alt="" />
    <img src="./watermark-4.png" alt="" />
    <img src="./watermark-5.png" alt="" />
  </div>
  <main class="page">
    <h1>今天吃什么？</h1>
    <div class="actions" aria-label="随机选择食材">
      <section class="choice">
        <button id="vegetable-button" type="button" disabled><span class="button-label">随机生成一种蔬菜</span></button>
        <div class="result" id="vegetable-result" hidden aria-live="polite"></div>
      </section>
      <section class="choice">
        <button id="meat-button" type="button" disabled><span class="button-label">随机生成一种肉类</span></button>
        <div class="result" id="meat-result" hidden aria-live="polite"></div>
      </section>
    </div>
    <p class="error-message" id="load-error" role="alert" hidden>清单加载失败，请刷新页面重试。</p>
  </main>
</body>
</html>
